name: Bug report
description: Something is drawn wrong, missing or the card does not load.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can. If your card version shows a document button in the header, copy its diagnostic report, review entity ids for private names, and paste it below. The report stays local until you paste it.
  - type: input
    id: version
    attributes:
      label: Card version
      description: Shown in the browser console as "HEATPUMP-FLOW-CARD x.y.z" or in HACS.
      placeholder: 0.9.6
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.10.1
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Preset
      options:
        - lambda
        - vicare
        - vaillant
        - emsesp
        - heishamon
        - none (manual entities)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens and what did you expect?
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: Card configuration (YAML)
      render: yaml
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report / entity list
      description: Copy the report with the document button in the card header and remove anything private before sharing. For an older version without the button, paste relevant entity ids with example states and units.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag & drop an image here.
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: F12 → Console, copy any red lines mentioning heatpump-flow-card.
      render: text
