name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dist/heatpump-flow-card.js

  selftest:
    name: Self-test (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test/selftest.html in headless Chrome
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files \
            --virtual-time-budget=15000 --dump-dom "file://$PWD/test/selftest.html" > selftest-out.html
          grep -A200 '<pre id="log">' selftest-out.html | sed '/<\/pre>/q'
          grep -q '<pre id="result">PASS</pre>' selftest-out.html
